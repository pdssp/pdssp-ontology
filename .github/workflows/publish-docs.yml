name: Publish ontology documentation

# Regenerates the merged ontology entirely from this repo's own source
# (src/pdssp_ontology/stac_seed.py + epntap_seed.py -- see
# merge_ontology.py's own docstring: this package owns the whole ontology,
# no live third-party service is ever contacted), runs Widoco over it, and
# publishes the result to GitHub Pages.
#
# One-time setup this workflow can't do for you: in this repo's Settings
# -> Pages, set "Source" to "GitHub Actions".
#
# Runs on every push touching the ontology's own source, and on demand.

on:
  push:
    branches: [main]
    paths:
      - "src/pdssp_ontology/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancelling it mid-deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BASE: https://pdssp.github.io/pdssp-ontology
  WIDOCO_VERSION: "1.4.25"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: uv sync

      # Writes development/ontology.ttl (combined, for the root overview
      # site below) plus one development/<name>.ttl per named graph
      # (stac.ttl/epntap.ttl, see write_per_graph_turtle) -- each gets its
      # own separate Widoco/WebVOWL run below, so e.g. the epntap named
      # graph's own IRI can resolve to an EPN-TAP-only WebVOWL instead of
      # only ever appearing merged into the combined view.
      - name: Build the ontology (combined + one Turtle file per named graph)
        run: uv run python -m pdssp_ontology.merge_ontology --base "$BASE"

      - name: Set up Java (for Widoco)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Widoco
        run: |
          curl -sL -o widoco.jar \
            "https://github.com/dgarijo/Widoco/releases/download/v${WIDOCO_VERSION}/widoco-${WIDOCO_VERSION}-jar-with-dependencies_JDK-17.jar"

      # Three independent Widoco runs: the combined overview at the site
      # root, and one per vocabulary so each has its own WebVOWL graph
      # (not mixed with the other vocabulary's classes/properties).
      - name: Generate documentation with Widoco (combined overview)
        run: |
          java -jar widoco.jar \
            -ontFile development/ontology.ttl \
            -outFolder site \
            -lang en \
            -getOntologyMetadata \
            -webVowl \
            -rewriteAll

      - name: Generate documentation with Widoco (STAC vocabulary)
        run: |
          java -jar widoco.jar \
            -ontFile development/stac.ttl \
            -outFolder site/stac \
            -lang en \
            -getOntologyMetadata \
            -webVowl \
            -rewriteAll

      - name: Generate documentation with Widoco (EPN-TAP vocabulary)
        run: |
          java -jar widoco.jar \
            -ontFile development/epntap.ttl \
            -outFolder site/epntap \
            -lang en \
            -getOntologyMetadata \
            -webVowl \
            -rewriteAll

      # Widoco only generates index-en.html; GitHub Pages needs index.html
      # as the default document for a bare directory URL to resolve, at
      # each of the three site roots.
      - name: Add index.html to each site
        run: |
          cp site/index-en.html site/index.html
          cp site/stac/index-en.html site/stac/index.html
          cp site/epntap/index-en.html site/epntap/index.html

      # The named graph IRIs merge_ontology.py mints (.../stac/vocabulary,
      # .../epntap/vocabulary) need to actually resolve to something --
      # a redirect to that vocabulary's own Widoco/WebVOWL page.
      - name: Add named-graph IRI redirects
        run: |
          mkdir -p site/stac/vocabulary site/epntap/vocabulary
          for name in stac epntap; do
            cat > "site/$name/vocabulary/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=../index-en.html">
            <link rel="canonical" href="../index-en.html">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>This is the ${name} vocabulary's graph identifier. See its
            <a href="../index-en.html">documentation</a>.</p>
          </body>
          </html>
          EOF
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
