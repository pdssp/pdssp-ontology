name: Publish ontology documentation

# Regenerates the ontology entirely from this repo's own source (see
# merge_ontology.py's own docstring: this package owns the whole
# ontology, no live third-party service is ever contacted), runs Widoco
# once per data model/mapping, and publishes the result to GitHub Pages.
# The site root is a plain catalogue page linking to each -- never a
# merged/flattened ontology of its own, so each data model's ontology
# stays independently dereferenceable (see the README).
#
# One-time setup this workflow can't do for you: in this repo's Settings
# -> Pages, set "Source" to "GitHub Actions".
#
# Runs on every push touching the ontology's own source, and on demand.

on:
  push:
    branches: [main]
    paths:
      - "src/pdssp_ontology/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancelling it mid-deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BASE: https://pdssp.github.io/pdssp-ontology
  WIDOCO_VERSION: "1.4.25"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: uv sync

      # Writes one development/<name>.ttl per named graph (pdssp-stac.ttl,
      # epn-tap.ttl, mappings-pdssp-stac-epn-tap.ttl, vocab.ttl -- see
      # write_per_graph_turtle), each getting its own separate Widoco run
      # below so every data model's ontology -- and the mapping between
      # two of them -- is independently dereferenceable.
      - name: Build the ontology (one Turtle file per named graph)
        run: uv run python -m pdssp_ontology.merge_ontology --base "$BASE"

      - name: Set up Java (for Widoco)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Widoco
        run: |
          curl -sL -o widoco.jar \
            "https://github.com/dgarijo/Widoco/releases/download/v${WIDOCO_VERSION}/widoco-${WIDOCO_VERSION}-jar-with-dependencies_JDK-17.jar"

      - name: Generate documentation with Widoco (PDSSP/STAC vocabulary)
        run: |
          java -jar widoco.jar \
            -ontFile development/pdssp-stac.ttl \
            -outFolder site/pdssp-stac \
            -lang en \
            -getOntologyMetadata \
            -includeAnnotationProperties \
            -webVowl \
            -rewriteAll

      - name: Generate documentation with Widoco (EPN-TAP vocabulary)
        run: |
          java -jar widoco.jar \
            -ontFile development/epn-tap.ttl \
            -outFolder site/epn-tap \
            -lang en \
            -getOntologyMetadata \
            -includeAnnotationProperties \
            -webVowl \
            -rewriteAll

      # This graph's own IRI (mappings/pdssp-stac-epn-tap, no extra
      # "/vocabulary" segment) already matches its site directory, so
      # unlike the two vocabularies below it needs no separate redirect.
      - name: Generate documentation with Widoco (STAC <-> EPN-TAP mapping)
        run: |
          java -jar widoco.jar \
            -ontFile development/mappings-pdssp-stac-epn-tap.ttl \
            -outFolder site/mappings/pdssp-stac-epn-tap \
            -lang en \
            -getOntologyMetadata \
            -includeAnnotationProperties \
            -webVowl \
            -rewriteAll

      # The shared pdssp: classes/properties the three graphs above
      # reference by IRI but never themselves define (see
      # shared_vocab.py's own docstring) -- this graph's own IRI
      # ({base}/vocab) already matches its site directory, same as the
      # mapping graph above, so it needs no separate redirect either.
      - name: Generate documentation with Widoco (shared vocabulary)
        run: |
          java -jar widoco.jar \
            -ontFile development/vocab.ttl \
            -outFolder site/vocab \
            -lang en \
            -getOntologyMetadata \
            -includeAnnotationProperties \
            -webVowl \
            -rewriteAll

      # Widoco's own generated loadHash() (in every index-en.html) scrolls
      # to a URL fragment on load via `$(hash).offset()` -- jQuery treats
      # a leading-"#" string as a CSS selector, which works for a simple
      # slug (`#providers`) but throws "Syntax error, unrecognized
      # expression" for the full-IRI-style fragments this ontology's own
      # shared pdssp:X classes/properties use as their own id
      # (`#https://.../vocab#collectionScoped`, two "#" characters) --
      # confirmed empirically (Node + jsdom + the real jquery package)
      # both that this exact selector throws and that
      # `document.getElementById` (a literal string lookup, no CSS
      # parsing) finds the same element without issue either way. Patched
      # in-place after every build, not upstreamed to Widoco itself: this
      # ontology suite's own fully-qualified ids are the unusual case, not
      # a bug in Widoco's own typical usage.
      - name: Fix Widoco's loadHash() to use getElementById, not a CSS selector
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          broken = """\tvar hash = location.hash;
          \tif($(hash).offset()!=null){
          \t  $('html, body').animate({scrollTop: $(hash).offset().top}, 0);
          }"""
          fixed = """\tvar hash = location.hash;
          \tif (hash) {
          \t  var el = document.getElementById(decodeURIComponent(hash.substring(1))) || document.getElementById(hash.substring(1));
          \t  if (el) {
          \t    $('html, body').animate({scrollTop: $(el).offset().top}, 0);
          \t  }
          \t}"""

          paths = [
              "site/pdssp-stac/index-en.html",
              "site/epn-tap/index-en.html",
              "site/mappings/pdssp-stac-epn-tap/index-en.html",
              "site/vocab/index-en.html",
          ]
          for path in paths:
              text = Path(path).read_text()
              if broken not in text:
                  raise SystemExit(f"{path}: expected loadHash() snippet not found -- Widoco version changed?")
              Path(path).write_text(text.replace(broken, fixed))
              print(f"patched {path}")
          PYEOF

      # Widoco only generates index-en.html; GitHub Pages needs index.html
      # as the default document for a bare directory URL to resolve, at
      # each site.
      - name: Add index.html to each site
        run: |
          cp site/pdssp-stac/index-en.html site/pdssp-stac/index.html
          cp site/epn-tap/index-en.html site/epn-tap/index.html
          cp site/mappings/pdssp-stac-epn-tap/index-en.html site/mappings/pdssp-stac-epn-tap/index.html
          cp site/vocab/index-en.html site/vocab/index.html

      # A previous version of this workflow rewrote pdssp:X links
      # (href="#<full external IRI>", e.g. pdssp:EpnTapGranule) into
      # absolute links to the separate vocab site. That looked more
      # correct, but was wrong: each site fully embeds its own copy of
      # every pdssp: class/property it uses (see e.g. epntap_vocabulary.py's
      # own docstring), so its local anchor (verified: the href fragment
      # matches that element's own id exactly, so it genuinely navigates
      # there) shows a richer "is in domain of" listing -- every attribute
      # attached to that class -- that the vocab site's own copy of the
      # same class cannot show, since vocab.ttl alone never sees the
      # domain triples that live in another graph's own file. Rewriting
      # the link to the "canonical" vocab page traded that away for a
      # cosmetic fix (the raw href text looks odd, even though it works),
      # so it is not done: Widoco's own same-page anchors are kept as-is.
      #
      # The mapping site is a genuine exception to the above, not a
      # repeat of the same mistake: a link there to an actual EPN-TAP/STAC
      # *term* (e.g. #.../epn-tap/vocabulary#access_url, as opposed to a
      # shared pdssp:X class/property, which mappings-pdssp-stac-epn-tap.ttl
      # DOES fully embed, same as above) resolves to a same-page anchor
      # that IS present -- but confirmed empirically to show that term
      # mis-rendered as an untyped "named individual" with an ugly
      # humanized title ("access url") and no label/comment/domain at all,
      # since stac_epntap_mapping.py only ever asserts a few *extra*
      # mapping-specific facts (mappedFrom, toStacConverter, ...) about
      # that same subject IRI, never a full copy of the term itself (see
      # that module's own docstring). Unlike the case above, the local
      # anchor here is strictly worse than the term's own real page, so
      # it is rewritten -- to that page's root (not attempting to also
      # match the target page's own, differently-slugged anchor id, which
      # would need per-graph knowledge baked into this sed and was judged
      # not worth the fragility for a cosmetic scroll position).
      - name: Fix mapping-site links to EPN-TAP/STAC terms (not shared pdssp:X classes)
        run: |
          find site/mappings/pdssp-stac-epn-tap -name "*.html" -exec sed -i -E \
            -e 's|href="#https://pdssp\.github\.io/pdssp-ontology/epn-tap/vocabulary#[^"]*"|href="https://pdssp.github.io/pdssp-ontology/epn-tap/"|g' \
            -e 's|href="#https://pdssp\.github\.io/pdssp-ontology/pdssp-stac/vocabulary#[^"]*"|href="https://pdssp.github.io/pdssp-ontology/pdssp-stac/"|g' \
            {} +

      # The named-graph IRIs merge_ontology.py mints for the two
      # vocabularies (.../pdssp-stac/vocabulary, .../epn-tap/vocabulary)
      # have one path segment ("vocabulary") beyond their own site
      # directory -- a redirect to that vocabulary's own Widoco/WebVOWL
      # page resolves them instead of 404ing. A meta-refresh alone drops
      # the original URL's fragment (e.g. a specific term's own
      # #access_estsize anchor), silently landing every such link on the
      # top of the page instead of that term -- the inline script fixes
      # that for the common case (JS enabled) by carrying it over
      # explicitly; the meta-refresh stays as a no-JS fallback (which does
      # lose the fragment, an accepted, minor degradation).
      - name: Add named-graph IRI redirects
        run: |
          mkdir -p site/pdssp-stac/vocabulary site/epn-tap/vocabulary
          for name in pdssp-stac epn-tap; do
            cat > "site/$name/vocabulary/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <script>location.replace("../index-en.html" + location.hash);</script>
            <meta http-equiv="refresh" content="0; url=../index-en.html">
            <link rel="canonical" href="../index-en.html">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>This is the ${name} vocabulary's graph identifier. See its
            <a href="../index-en.html">documentation</a>.</p>
          </body>
          </html>
          EOF
          done

      # The site root is a plain catalogue of the ontologies this repo
      # publishes -- never a merged/flattened ontology of its own (each
      # data model's ontology, and the mapping between two of them, stays
      # independently dereferenceable; see the README).
      - name: Add the root catalogue page
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PDSSP ontologies</title>
          </head>
          <body>
            <h1>PDSSP ontologies</h1>
            <p>One independent ontology per data model, plus the mapping(s) between them.</p>
            <ul>
              <li><a href="pdssp-stac/">PDSSP/STAC vocabulary</a></li>
              <li><a href="epn-tap/">EPN-TAP vocabulary</a></li>
              <li><a href="mappings/pdssp-stac-epn-tap/">STAC &lt;-&gt; EPN-TAP mapping</a></li>
              <li><a href="vocab/">Shared vocabulary (classes/properties common to the above)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
