[project]
name = "pdssp-ontology"
readme = "README.md"
description = "PDSSP ontology suite -- one independent, Fuseki-hosted, Widoco-published named graph per data model (starting with the PDSSP thesaurus: product type, method, processing level), plus the mapping(s) between them."
authors = [{name = "Jean-Christophe Malapert", email = "jean-christophe.malapert@cnes.fr"}]
license = "Apache-2.0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.0.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdssp_ontology"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
