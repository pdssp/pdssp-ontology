[project]
name = "pdssp-ontology"
readme = "README.md"
description = "Canonical EPN-TAP <-> STAC mapping, merged with ode-stac-proxy's PDS3 <-> STAC vocabulary into one Fuseki-hosted, Widoco-published ontology."
authors = [{name="Jean-Christophe Malapert", email="jean-christophe.malapert@cnes.fr"}]
license = "Apache-2.0"
packages = [{include = "pdssp_ontology"}]
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.0.0",
    "httpx>=0.28.1",
    "epntap2cql2",
    "ode_stac_proxy",
]

# TODO: switch to the published git URLs once these are pushed.
[tool.uv.sources]
epntap2cql2 = { path = "../epntap2cql2" }
ode_stac_proxy = { path = "../ode-stac-proxy" }

# ── Build ────────────────────────────────────────────────────────────────────
[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdssp_ontology"]

# ── Dev dependencies ─────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
